name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Generate and report coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install testing and coverage tools
        run: |
          python -m pip install pytest==8.4.1 pytest-cov coverage

      - name: Run tests with coverage and fail under threshold
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Publish coverage report on pull request
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 60
          MINIMUM_ORANGE: 50
          COVERAGE_PATH: ./coverage.xml