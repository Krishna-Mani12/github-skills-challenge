name: Python Package

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install testing tools
        run: |
          python -m pip install pytest==8.4.1 pytest-cov coverage

      - name: Run the test suite with detailed output
        run: |
          pytest -q -vv --maxfail=1 --disable-warnings
